app-id: network.bisq.Bisq
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: Bisq
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --env=PATH=/usr/bin:/app/bin:/app/jdk/bin
  - --env=JAVA_HOME=/app/jdk
  - --persist=.local/share/Bisq
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/installjdk.sh
  - name: bisq
    buildsystem: simple
    build-commands:
      - ar x Bisq.deb
      - rm Bisq.deb
      - tar xf data.tar.xz
      - >-
        expected_version=$(xmllint --xpath 'string(/component/releases/release[1]/@version)' network.bisq.Bisq.appdata.xml)
        && opt/bisq/bin/Bisq --help 2>&1
        | grep -Fx "Bisq Desktop version ${expected_version}"
      - cp -r opt/bisq/lib /app/lib
      - install -D opt/bisq/bin/Bisq /app/bin/Bisq

      - install -D network.bisq.Bisq.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.appdata.xml
      - install -D network.bisq.Bisq.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -D icon.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: file
        sha256: 3d18e920388c305dc0bf8ff7b099c4902500d17f880e296b6635084f6ef954e7
        url: https://bisq.network/downloads/v1.10.7/Bisq-64bit-1.10.7.deb
        dest-filename: Bisq.deb
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/bisq-network/bisq/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://bisq.network/downloads/v" + $version +
            "/Bisq-64bit-" + $version + ".deb"'
          release-url-template: https://github.com/bisq-network/bisq/releases/tag/v$version
          is-main-source: true
      - type: file
        path: network.bisq.Bisq.appdata.xml
      - type: file
        path: network.bisq.Bisq.desktop
      - type: file
        url: https://raw.githubusercontent.com/bisq-network/bisq/6412213100fda41c760dba04d10eaa7748745779/Bisq1_icon.svg
        sha256: 6836845c01a1f1cc42117214c7c508eac9451b7e5c6d6dc40167d8a786b921ff
        dest-filename: icon.svg
